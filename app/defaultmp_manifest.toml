# BO2 multiplayer (default_mp.xex) for the rexglue-sdk codegen.
#
# game_root / file_path: the game folder bo2-dev\game (your own copy of the title, not included;
# see README.md). Codegen reads default_mp.xex from it.

[project]
sdk_version = "0.12.0"
name = "defaultmp"
game_root = "../game"
hook_sources = ["src"]

[entrypoint]
file_path = "../game/default_mp.xex"
out_directory_path = "generated/default_mp"
includes = []
setjmp_address = 0x82918CA0
longjmp_address = 0x82919E50

[entrypoint.functions]
# Title update 18 addresses, mapped from the disc version by byte matches (0x821C47C8 changed
# in TU18 and has no match; left out until codegen asks for it).
0x8249AD08 = { end = 0x8249AD10 }
0x82803088 = {}
0x827FDFF0 = {}
0x828044F0 = {}
0x82809990 = {}
0x82274C98 = {}
