# BO2 multiplayer (default_mp.xex) for the rexglue-sdk codegen.
#
# game_root / file_path: the game folder bo2-dev\game (your own copy of the title, not included;
# see README.md). Codegen reads default_mp.xex from it.

[project]
sdk_version = "0.12.0"
name = "defaultmp"
game_root = "../game"
hook_sources = ["src"]

[entrypoint]
file_path = "../game/default_mp.xex"
out_directory_path = "generated/default_mp"
includes = []
setjmp_address = 0x827D8600
longjmp_address = 0x827D9790

[entrypoint.functions]
0x82425F18 = { end = 0x82425F20 }
0x826c4428 = {}
0x826bf2f0 = {}
0x826c5818 = {}
0x826cacb8 = {}
0x8221af28 = {}
0x821c47c8 = {}
